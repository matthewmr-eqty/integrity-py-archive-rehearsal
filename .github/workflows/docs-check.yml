name: Docs build check

# Builds docs-site/ on pull requests that touch it and attaches the built site, so a
# reviewer can download and open it. Deploys nothing; .github/workflows/docs.yml owns deploys.
# release.yml dispatches it on the archive PR's branch, which github.token's push cannot trigger.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/generated/**'
      - 'examples/**'
      - 'scripts/render_api_docs.py'
      - 'scripts/api-directives.json'
      - '.github/workflows/docs-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # @eqtylab/docs reads release tags to build older versions; a shallow clone has none.
          fetch-depth: 0
      # Third-party actions come through the eqtylab-actions mirrors, as in the other workflows.
      - uses: eqtylab-actions/setup-pnpm@master
        with:
          # No package.json at the repo root; the pnpm version is pinned in the site's.
          package_json_file: docs-site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs-site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs-site
      - run: pnpm build
        working-directory: docs-site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs-site/dist
          retention-days: 7
