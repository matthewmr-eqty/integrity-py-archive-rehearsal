env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

name: Publish new release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      eqty_sdk_version:
        description: SDK version to publish
        required: true

jobs:
  check_changelog:
    name: Check release changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4

      - name: Check release changelog
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.eqty_sdk_version || github.ref_name }}
        run: ./scripts/check-changelog.sh "v${RELEASE_VERSION#v}"

  build_and_publish:
    needs: check_changelog
    strategy:
      matrix:
        include:
          - platform: ubuntu-latest
            artifact_suffix: linux-x86_64
          - platform: ubuntu-24.04-arm
            artifact_suffix: linux-aarch64
          - platform: macos-15-xlarge
            artifact_suffix: macos-arm64
            macos_report: dist/otool-show-macos-arm64.txt
          - platform: macos-15-large
            artifact_suffix: macos-x86_64
            macos_report: dist/otool-show-macos-x86_64.txt
          - platform: windows-latest
            artifact_suffix: windows-x86_64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Install Nix
        if: runner.os != 'Windows'
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        if: runner.os != 'Windows'
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
        continue-on-error: true

      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4

      - name: Setup Python
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: Setup Rust
        if: runner.os == 'macOS' || runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Set Commit Hash in Description (linux/windows)
        if: runner.os != 'macOS'
        shell: bash
        run: sed -i 's/description = ".*"/description = "'"$(git rev-parse --short=7 HEAD)"'"/' Cargo.toml

      - name: Set Commit Hash in Description (macos)
        if: runner.os == 'macOS'
        run: sed -i '' 's/description = ".*"/description = "'"$(git rev-parse --short=7 HEAD)"'"/' Cargo.toml

      - name: Set Python package version (linux/windows)
        if: runner.os != 'macOS'
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.eqty_sdk_version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+!_-]*)
              echo "Tag version contains unsupported characters: $version"
              exit 1
              ;;
          esac
          sed -i '/^\[project\]$/,/^\[/s/^version = ".*"/version = "'"$version"'"/' pyproject.toml

      - name: Set Python package version (macos)
        if: runner.os == 'macOS'
        env:
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.eqty_sdk_version || github.ref_name }}
        run: |
          version="${VERSION#v}"
          case "$version" in
            ''|*[!0-9A-Za-z.+!_-]*)
              echo "Tag version contains unsupported characters: $version"
              exit 1
              ;;
          esac
          sed -i '' '/^\[project\]$/,/^\[/s/^version = ".*"/version = "'"$version"'"/' pyproject.toml

      - name: Build sdist
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          IFS='.' read -r python_major python_minor _ < .python-version
          if [ -z "${python_major}" ] || [ -z "${python_minor}" ]; then
            echo "Expected at least major.minor in .python-version"
            exit 1
          fi
          python_abi_tag="${python_major}${python_minor}"

          rm -rf dist/sdist
          mkdir -p dist/sdist

          docker run --rm \
            -e PYTHON_ABI_TAG="${python_abi_tag}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "${PWD}:/io" \
            -w /io \
            quay.io/pypa/manylinux2014_x86_64 \
            /bin/sh -lc '
              set -eu

              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"

              pybin="/opt/python/cp${PYTHON_ABI_TAG}-cp${PYTHON_ABI_TAG}/bin/python"
              "$pybin" -m pip install --upgrade pip maturin
              "$pybin" -m maturin sdist --manifest-path Cargo.toml --out dist/sdist
              chown -R "$HOST_UID:$HOST_GID" dist/sdist
            '

      - name: Verify sdist size
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          sdist="$(find dist/sdist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          size_bytes="$(stat -c %s "$sdist")"
          echo "$(basename "$sdist"): ${size_bytes} bytes"
          test "$size_bytes" -le 104857600

      - name: Build Linux Wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          IFS='.' read -r python_major python_minor _ < .python-version
          if [ -z "${python_major}" ] || [ -z "${python_minor}" ]; then
            echo "Expected at least major.minor in .python-version"
            exit 1
          fi
          python_abi_tag="${python_major}${python_minor}"

          case "${{ matrix.platform }}" in
            ubuntu-latest)
              build_specs=$'linux-manylinux|quay.io/pypa/manylinux2014_x86_64|manylinux2014|dist/auditwheel-show-linux-x86_64.txt\nlinux-musllinux|quay.io/pypa/musllinux_1_2_x86_64|musllinux_1_2|dist/auditwheel-show-musllinux-x86_64.txt'
              ;;
            ubuntu-24.04-arm)
              build_specs=$'linux-manylinux|quay.io/pypa/manylinux2014_aarch64|manylinux2014|dist/auditwheel-show-linux-aarch64.txt\nlinux-musllinux|quay.io/pypa/musllinux_1_2_aarch64|musllinux_1_2|dist/auditwheel-show-musllinux-aarch64.txt'
              ;;
            *)
              echo "Unsupported Linux runner: ${{ matrix.platform }}"
              exit 1
              ;;
          esac

          while IFS='|' read -r out_dir builder_image compatibility auditwheel_report; do
            [ -n "$out_dir" ] || continue
            rm -rf "dist/${out_dir}"
            mkdir -p "dist/${out_dir}"

            docker run --rm \
              -e PYTHON_ABI_TAG="${python_abi_tag}" \
              -e OUT_DIR="dist/${out_dir}" \
              -e COMPATIBILITY="${compatibility}" \
              -e AUDITWHEEL_REPORT="${auditwheel_report}" \
              -e HOST_UID="$(id -u)" \
              -e HOST_GID="$(id -g)" \
              -v "${PWD}:/io" \
              -w /io \
              "${builder_image}" \
              /bin/sh -lc '
                set -eu

                openssl_prefix="/opt/openssl-3.0.17"
                export OPENSSL_DIR="$openssl_prefix"
                export PKG_CONFIG_PATH="$openssl_prefix/lib64/pkgconfig:$openssl_prefix/lib/pkgconfig"

                if command -v yum >/dev/null 2>&1; then
                  yum install -y curl pkgconfig gcc perl-core make
                elif command -v apk >/dev/null 2>&1; then
                  apk add --no-cache curl perl pkgconf build-base
                else
                  echo "Unsupported package manager in build image"
                  exit 1
                fi

                curl -LO https://github.com/openssl/openssl/releases/download/openssl-3.0.17/openssl-3.0.17.tar.gz
                tar -xzf openssl-3.0.17.tar.gz
                cd openssl-3.0.17
                ./Configure --prefix="$openssl_prefix" --openssldir="$openssl_prefix" shared
                make -j"$(getconf _NPROCESSORS_ONLN)"
                make install_sw
                cd /io

                curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
                . "$HOME/.cargo/env"

                pybin="/opt/python/cp${PYTHON_ABI_TAG}-cp${PYTHON_ABI_TAG}/bin/python"
                "$pybin" -m pip install --upgrade pip maturin
                if [ -n "$AUDITWHEEL_REPORT" ]; then
                  "$pybin" -m pip install --upgrade auditwheel
                fi

                "$pybin" -m maturin build \
                  --manifest-path Cargo.toml \
                  --release \
                  --interpreter "$pybin" \
                  --compatibility "$COMPATIBILITY" \
                  --out "$OUT_DIR"

                if [ -n "$AUDITWHEEL_REPORT" ]; then
                  wheel="$(find "$OUT_DIR" -maxdepth 1 -type f -name "*.whl" | head -n 1)"
                  "$pybin" scripts/generate_auditwheel_report.py \
                    "$wheel" \
                    "$AUDITWHEEL_REPORT"
                fi

                chown -R "$HOST_UID:$HOST_GID" dist
              '
          done <<< "${build_specs}"

      - name: Upload auditwheel report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: auditwheel-report-${{ matrix.platform }}
          path: dist/auditwheel-show-*.txt
          retention-days: 1

      - name: Upload x86_64 wheel for docs
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v6
        with:
          name: linux-wheel-x86_64
          path: dist/linux-manylinux/*.whl
          retention-days: 1

      - name: Build Mac Wheel
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip maturin twine
          maturin build --manifest-path Cargo.toml --release --out dist

      - name: Validate Mac Wheel
        if: runner.os == 'macOS'
        shell: bash
        env:
          OTOOL_REPORT: ${{ matrix.macos_report }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess
          import sys
          import tempfile
          import zipfile

          dist_dir = pathlib.Path("dist")
          wheels = sorted(dist_dir.glob("*.whl"))
          if not wheels:
              raise SystemExit("No wheel found in dist/")
          if len(wheels) != 1:
              raise SystemExit(f"Expected exactly 1 wheel, found {len(wheels)}: {[w.name for w in wheels]}")

          wheel_path = wheels[0]
          with tempfile.TemporaryDirectory() as tmpdir:
              extract_dir = pathlib.Path(tmpdir)
              with zipfile.ZipFile(wheel_path) as zf:
                  zf.extractall(extract_dir)

              so_files = sorted(extract_dir.rglob("*.so"))
              if not so_files:
                  raise SystemExit("No .so extension found inside built wheel")
              if len(so_files) != 1:
                  raise SystemExit(f"Expected exactly 1 .so file, found {len(so_files)}: {[p.name for p in so_files]}")

              otool = shutil.which("otool")
              if otool is None:
                  raise SystemExit("otool not found on PATH")

              output = subprocess.check_output([otool, "-L", str(so_files[0])], text=True)
              print(output)
              report_path = pathlib.Path(os.environ["OTOOL_REPORT"])
              report_path.write_text(output, encoding="utf-8")
              if "/nix/store/" in output:
                  raise SystemExit("Wheel links against /nix/store libraries")
          PY

      - name: Upload macOS linkage report
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: otool-report-${{ matrix.artifact_suffix }}
          path: ${{ matrix.macos_report }}
          retention-days: 1

      - name: Build Windows Wheel
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --manifest-path Cargo.toml --release --out dist

      - name: Upload package distributions
        uses: actions/upload-artifact@v6
        with:
          name: package-distributions-${{ matrix.artifact_suffix }}
          path: |
            dist/*.whl
            dist/**/*.whl
            dist/sdist/*.tar.gz
          if-no-files-found: error

  publish_to_pypi:
    needs: build_and_publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v7
        with:
          pattern: package-distributions-*
          path: dist
          merge-multiple: true

      - name: Flatten package distributions
        shell: bash
        run: |
          find dist -mindepth 2 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 \
            | xargs -0 -r -n1 mv -t dist
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          find dist -maxdepth 1 -type f -name '*-linux_*.whl' -delete

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Update GitHub release with PyPI link
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v8
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const pypiUrl = `https://pypi.org/project/eqty-sdk/`;
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            const marker = 'PyPI package:';
            const line = `${marker} ${pypiUrl}`;
            const body = release.data.body || '';
            const nextBody = body.includes(marker) ? body : `${body}\n\n${line}`.trim();
            if (nextBody !== body) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                body: nextBody,
              });
            }

  release_metadata:
    needs: publish_to_pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_docs: ${{ steps.release.outputs.publish_docs }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Determine GitHub Release status
        id: release
        uses: actions/github-script@v8
        env:
          RELEASE_IDENTIFIER: ${{ github.event_name == 'workflow_dispatch' && inputs.eqty_sdk_version || github.ref_name }}
        with:
          script: |
            const identifier = process.env.RELEASE_IDENTIFIER;
            const tag = identifier.startsWith('v') ? identifier : `v${identifier}`;
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setOutput('publish_docs', String(!release.data.prerelease));
              core.setOutput('version', tag.replace(/^v/, ''));
            } catch (error) {
              if (error.status !== 404) throw error;
              core.warning(`No GitHub Release found for ${tag}; skipping docs publication.`);
              core.setOutput('publish_docs', 'false');
              core.setOutput('version', '');
            }

  publish_release_docs:
    if: needs.release_metadata.outputs.publish_docs == 'true'
    needs: release_metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install Nix
        uses: eqtylab-actions/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Cachix
        uses: eqtylab-actions/cachix-action@v16
        with:
          name: eqtylab
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
        continue-on-error: true

      - name: Checkout Repo
        uses: eqtylab-actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x86_64 auditwheel report
        uses: actions/download-artifact@v7
        with:
          name: auditwheel-report-ubuntu-latest
          path: docs/generated

      - name: Download x86_64 wheel
        uses: actions/download-artifact@v7
        with:
          name: linux-wheel-x86_64
          path: dist

      - name: Download aarch64 auditwheel report
        uses: actions/download-artifact@v7
        with:
          name: auditwheel-report-ubuntu-24.04-arm
          path: docs/generated

      - name: Download macOS linkage report
        uses: actions/download-artifact@v7
        with:
          name: otool-report-macos-arm64
          path: docs/generated

      - name: Download macOS Intel linkage report
        uses: actions/download-artifact@v7
        with:
          name: otool-report-macos-x86_64
          path: docs/generated

      - name: Build nix shell
        run: nix develop . -c true

      - name: Rust Cache
        uses: eqtylab-actions/rust-cache@v2

      - name: Reset cached Cargo build scripts
        run: rm -rf target/debug/build target/release/build

      - name: Install dependencies
        run: nix develop . -c just install

      - name: Install released wheel into docs environment
        run: nix develop . -c poetry run python -m pip install dist/*.whl

      - name: Install mike
        run: nix develop . -c poetry run python -m pip install mike

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        env:
          VERSION: ${{ needs.release_metadata.outputs.version }}
        run: |
          git fetch origin gh-pages --depth=1 || true
          nix develop . -c poetry run mike deploy --push --update-aliases "$VERSION" latest
          nix develop . -c poetry run mike set-default --push latest

  # A tag is pushed before its wheel reports exist, so the tag's copy of the docs only holds
  # placeholders. This saves the release's pages, with the real reports, as the version the site
  # serves once a newer release ships, and opens a PR for it.
  archive_release_docs:
    if: needs.release_metadata.outputs.publish_docs == 'true'
    needs: [release_metadata, publish_release_docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.release_metadata.outputs.version }}
    steps:
      - name: Checkout main
        uses: eqtylab-actions/checkout@v4
        with:
          ref: main
          # The script checks out the release tag in a worktree.
          fetch-depth: 0

      - name: Download x86_64 auditwheel report
        uses: actions/download-artifact@v7
        with:
          name: auditwheel-report-ubuntu-latest
          path: docs/generated

      - name: Download aarch64 auditwheel report
        uses: actions/download-artifact@v7
        with:
          name: auditwheel-report-ubuntu-24.04-arm
          path: docs/generated

      - name: Download macOS linkage report
        uses: actions/download-artifact@v7
        with:
          name: otool-report-macos-arm64
          path: docs/generated

      - name: Download macOS Intel linkage report
        uses: actions/download-artifact@v7
        with:
          name: otool-report-macos-x86_64
          path: docs/generated

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the API renderer
        run: python -m pip install griffe==1.14.0 griffe2md==1.2.5

      - name: Save the release's docs
        # bash, not the default `bash -e`, so pipefail keeps the script's exit status through tee.
        shell: bash
        run: scripts/archive_release.sh "$VERSION" | tee "$RUNNER_TEMP/archive.log"

      # Safe to re-run: a branch a failed run pushed is rebuilt from main, and a branch whose PR
      # is open is left as it is, with any commits pushed to it.
      - name: Open the archive PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="docs/archive-v$VERSION"
          # The script leaves docs-site alone when there is nothing to archive; docs/generated
          # always differs, since the reports were downloaded into it.
          if [ -z "$(git status --porcelain docs-site)" ]; then
            exit 0
          fi
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -q OPEN; then
            echo "The $VERSION archive PR is already open; left as it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add docs-site/archive docs/generated docs-site/src/content/docs
          git commit -m "docs: archive the $VERSION docs"
          git push --force origin "$branch"
          {
            echo "Saves the $VERSION docs, with the real wheel reports, as the version the site serves once a newer release ships."
            echo
            echo "Opened by release.yml, so the docs build check does not run on it: check the Vercel preview."
            if grep -q '^archive_release: backport' "$RUNNER_TEMP/archive.log"; then
              echo
              echo "A backport: latest's pages and reports are unchanged."
            fi
            if grep -q '^archive_release: vercel.json' "$RUNNER_TEMP/archive.log"; then
              echo
              grep '^archive_release: vercel.json' "$RUNNER_TEMP/archive.log" | sed 's/^archive_release: /- [ ] /'
            fi
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" \
            --title "docs: archive the $VERSION docs" \
            --body-file "$RUNNER_TEMP/body.md"
